[package]
name = "state-management"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.71"
bitflags = "2.3.2"
derive_more = { version = "0.99.17", default-features = false, features = ["into", "from"] }
egli = { version = "0.5.0", features = ["egl_1_5"] }
heck = "0.4.1"
input = { version = "0.8.2", features = ["log"] }
libc = "0.2.146"
log = { version = "0.4", features = ["std"] }
static_assertions = "1.1.0"
thiserror = "1.0.40"
toml = { version = "0.7.5", default-features = false }
udev = "0.7.0"
# wayland-scanner = "0.30.1"
xkbcommon = { version = "0.5.0", default-features = false }

# TODO: Put them in dev dependencies
itertools = "0.11.0"
wayland-scanner = { path = "/home/sebastien/github/wayland-rs/wayland-scanner" }
nix = "0.26.2"
owo-colors = "3.5.0"
dbus-message-parser = "4.3.1"

[dev-dependencies]
rand = "0.8.5"
mktemp = "0.5.0"

[target.'cfg(loom)'.dependencies]
loom = "0.5"
