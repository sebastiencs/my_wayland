[package]
name = "state-management"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0"
bitflags = "2.3"
derive_more = { version = "0.99.17", default-features = false, features = ["into", "from", "deref", "deref_mut"] }
heck = "0.4.1"
input = { version = "0.9", features = ["log"] }
libc = "0.2"
log = { version = "0.4", features = ["std"] }
static_assertions = "1.1"
thiserror = "1.0"
toml = { version = "0.8", default-features = false }
udev = "0.8"
xkbcommon = { version = "0.7", default-features = false }

# TODO: Put some of them in dev dependencies
itertools = "0.12"
wayland-scanner = { git = "https://github.com/sebastiencs/wayland-rs.git", branch = "my_wayland" }
nix = { version = "0.27", features = ["time", "fs", "user", "ioctl", "fs"] }
owo-colors = "4"
dbus-message-parser = "4"
drm = { git = "https://github.com/sebastiencs/drm-rs.git", branch = "my_wayland" }
drm-ffi = "0.7"
edid-rs = { git = "https://gitlab.com/sebastiencs/edid-rs.git" }
khronos-egl = { path = "/home/sebastien/github/khronos-egl", features = ["dynamic"] }
# khronos-egl = { version = "6", features = ["dynamic"] }
libloading = "0.8"
once_cell = "1.19.0"

[dev-dependencies]
rand = "0.8.5"
mktemp = "0.5.0"

[target.'cfg(loom)'.dependencies]
loom = "0.5"
