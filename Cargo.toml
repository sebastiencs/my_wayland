[package]
name = "state-management"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.71"
bitflags = "2.3.2"
derive_more = { version = "0.99.17", default-features = false, features = ["into", "from", "deref"] }
heck = "0.4.1"
input = { version = "0.8.2", features = ["log"] }
libc = "0.2.146"
log = { version = "0.4", features = ["std"] }
static_assertions = "1.1.0"
thiserror = "1.0.40"
toml = { version = "0.7.5", default-features = false }
udev = "0.7.0"
# wayland-scanner = "0.30.1"
xkbcommon = { version = "0.5.0", default-features = false }

# TODO: Put them in dev dependencies
itertools = "0.11.0"
wayland-scanner = { git = "https://github.com/sebastiencs/wayland-rs.git", branch = "my_wayland" }
nix = "0.26.2"
owo-colors = "3.5.0"
dbus-message-parser = "4.3.1"
drm = { git = "https://github.com/sebastiencs/drm-rs.git", branch = "my_wayland" }
drm-ffi = "0.5"
edid-rs = { git = "https://gitlab.com/sebastiencs/edid-rs.git" }
khronos-egl = { version = "5", features = ["dynamic"] }
libloading = "0.8.0"

[dev-dependencies]
rand = "0.8.5"
mktemp = "0.5.0"

[target.'cfg(loom)'.dependencies]
loom = "0.5"
