[package]
name = "state-management"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.71"
bitflags = "2.3.2"
derive_more = { version = "0.99.17", default-features = false, features = ["into", "from"] }
egli = { version = "0.5.0", features = ["egl_1_5"] }
env_logger = "0.10.0"
heck = "0.4.1"
input = "0.8.2"
libc = "0.2.146"
log = "0.4"
rustbus = "0.19.2"
static_assertions = "1.1.0"
thiserror = "1.0.40"
toml = "0.7.5"
udev = "0.7.0"
wayland-scanner = { path = "/home/sebastien/github/wayland-rs/wayland-scanner" }
# wayland-scanner = "0.30.1"
xkbcommon = { version = "0.5.0", default-features = false }

[dev-dependencies]
rand = "0.8.5"
mktemp = "0.5.0"
